<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f24">
  <meta name="description" content="A shared care record for families caring for someone at home.">
  <!-- Only this site, the app's Supabase project and Open Food Facts may be reached; no third-party scripts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://qhfjbdtakeagwtnhqmzk.supabase.co https://*.openfoodfacts.org; connect-src 'self' https://qhfjbdtakeagwtnhqmzk.supabase.co wss://qhfjbdtakeagwtnhqmzk.supabase.co https://world.openfoodfacts.org; media-src 'self' blob:; worker-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
  <title>The Caregiving Menu</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 id="screenTitle">Today</h1>
    <div class="topbar-actions">
      <span id="syncDot" class="sync-dot" title="Local only"></span>
      <button class="icon-btn help-btn" onclick="showScreen('help')" aria-label="How to use this app" title="How to use this app">?</button>
      <button class="icon-btn" onclick="showScreen('settings')" aria-label="Settings">&#9881;</button>
    </div>
  </header>

  <main id="screen" class="screen"></main>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="home" class="tab active" onclick="showScreen('home')"><span class="tab-ico">&#9728;</span>Today</button>
    <button data-tab="diary" class="tab" onclick="showScreen('diary')"><span class="tab-ico">&#9998;</span>Diary</button>
    <button data-tab="scan" class="tab tab-scan" onclick="openCapture()" aria-label="Log something"><span class="tab-ico">&#10010;</span>Log</button>
    <button data-tab="file" class="tab" onclick="showScreen('file')"><span class="tab-ico">&#128193;</span>File</button>
    <button data-tab="kitchen" class="tab" onclick="showScreen('kitchen')"><span class="tab-ico">&#127859;</span>Kitchen</button>
  </nav>

  <div id="sheet" class="sheet hidden" onclick="if (event.target === this) dismissSheet()">
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="assets/vendor/supabase-2.49.4.js" defer></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/units.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/logic.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/scanner.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/fluids.js"></script>
  <script src="assets/js/history.js"></script>
  <script src="assets/js/file.js"></script>
  <script src="assets/js/today.js"></script>
  <script src="assets/js/insights.js"></script>
  <script src="assets/js/cuff.js"></script>
  <script src="assets/js/snap.js"></script>
  <script src="assets/js/scribe.js"></script>
  <script src="assets/js/phototest.js"></script>
  <script src="assets/js/medcheck.js"></script>
  <script src="assets/js/handoff.js"></script>
  <script src="assets/js/voice.js"></script>
  <script src="assets/js/ask.js"></script>
  <script src="assets/js/capture.js"></script>
  <script src="assets/js/simple.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/nav.js"></script>
</body>
</html>
